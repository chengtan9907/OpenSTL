name: OpenSTL
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python>=3.8,<3.11
  - pytorch>=2.1.0
  - torchvision
  - numpy
  - hickle
  - pip
  - xarray>=0.19.0
  - netcdf4
  - dask
  - pip:
    - lightning>=2.2.1,<3.0
    - timm>=0.9.0,<2.0
    - decord
    - fvcore
    - lpips
    - pandas
    - scikit-image
    - opencv-python
    - matplotlib
    - einops
    - tqdm
    - PyWavelets
    - scikit-learn
prefix: /opt/anaconda3/envs/openstl